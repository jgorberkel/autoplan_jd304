[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jgorberkel-autoplan_jd304"
version = "0.1.0"
description = "按段落统计自动驾驶规划控制专家·知识库的时效性维护相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jgorberkel" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jgorberkel.github.io"
Repository = "https://github.com/jgorberkel/autoplan_jd304"
Issues = "https://github.com/jgorberkel/autoplan_jd304/issues"

[project.scripts]
autoplan_jd304 = "autoplan_jd304:main"

[tool.setuptools]
py-modules = ["autoplan_jd304"]
